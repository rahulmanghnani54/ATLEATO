<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atleato · Buttons</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#0a0b0d;--surface:#181a1f;--raised:#22242a;--border:rgba(255,255,255,0.07);
    --border-strong:rgba(255,255,255,0.14);--text:#f5f5f4;--text-2:rgba(245,245,244,0.62);--text-3:rgba(245,245,244,0.38);
    --primary:#e05a26;--primary-deep:#c4471a;--system:#dfff1f;
    --display:'Plus Jakarta Sans',sans-serif;--body:'Inter',sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--body);padding:40px;
    -webkit-font-smoothing:antialiased;background-image:radial-gradient(1000px 460px at 85% -12%,rgba(224,90,38,0.08),transparent 60%);}
  .eyebrow{font-weight:600;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--text-3);margin-bottom:6px;}
  h1{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-1px;margin-bottom:4px;}
  .sub{color:var(--text-2);font-size:14px;margin-bottom:34px;max-width:560px;line-height:1.5;}
  .grp{margin-bottom:30px;}
  .grp h2{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--text-2);margin-bottom:16px;display:flex;align-items:center;gap:10px;}
  .grp h2::after{content:"";flex:1;height:1px;background:var(--border);}
  .row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;}
  .btn{font-family:var(--display);font-weight:700;font-size:14.5px;letter-spacing:0.3px;
    border:none;border-radius:100px;padding:14px 26px;cursor:pointer;display:inline-flex;align-items:center;gap:9px;
    transition:transform .15s ease, box-shadow .2s ease, background .2s ease;}
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .primary{background:var(--primary);color:#fff;box-shadow:0 8px 24px -8px rgba(224,90,38,0.6);}
  .primary:hover{background:#ee6b34;box-shadow:0 12px 30px -8px rgba(224,90,38,0.7);}
  .secondary{background:var(--raised);color:var(--text);box-shadow:inset 0 0 0 1px var(--border-strong);}
  .secondary:hover{background:#2a2d34;}
  .ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--border-strong);}
  .ghost:hover{background:rgba(255,255,255,0.05);}
  .system{background:var(--system);color:#0a0b0d;}
  .system:hover{background:#e8ff52;}
  .sm{padding:9px 16px;font-size:12.5px;}
  .lg{padding:17px 34px;font-size:16px;}
  .disabled{opacity:.4;pointer-events:none;}
  .icon{width:16px;height:16px;display:inline-block;}
  .hint{font-size:11px;color:var(--text-3);margin-top:10px;}
</style>
</head>
<body>
  <div class="eyebrow">Atleato Design System</div>
  <h1>Buttons</h1>
  <p class="sub">Pill buttons with a single brand-orange primary. Volt-green is the system variant (toggles, OS-level actions) — never a brand CTA.</p>

  <div class="grp">
    <h2>Variants</h2>
    <div class="row">
      <button class="btn primary">START WORKOUT</button>
      <button class="btn secondary">View plan</button>
      <button class="btn ghost">Skip today</button>
      <button class="btn system">Enable calls</button>
    </div>
  </div>

  <div class="grp">
    <h2>Sizes</h2>
    <div class="row">
      <button class="btn primary lg">BEGIN SESSION →</button>
      <button class="btn primary">JOIN WAITLIST</button>
      <button class="btn primary sm">Log set</button>
    </div>
  </div>

  <div class="grp">
    <h2>With icon &amp; states</h2>
    <div class="row">
      <button class="btn primary"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 10.8a15.9 15.9 0 0 0 6.6 6.6l2.2-2.2a1.1 1.1 0 0 1 1.1-.27 12.6 12.6 0 0 0 3.9.63 1.1 1.1 0 0 1 1.1 1.1V20a1.1 1.1 0 0 1-1.1 1.1A17.6 17.6 0 0 1 2.9 4.1 1.1 1.1 0 0 1 4 3h3.5a1.1 1.1 0 0 1 1.1 1.1c0 1.35.21 2.66.63 3.9a1.1 1.1 0 0 1-.27 1.1z"/></svg>ANSWER CALL</button>
      <button class="btn secondary">Decline</button>
      <button class="btn primary disabled">UNAVAILABLE</button>
    </div>
    <div class="hint">Hover any button to preview the lift + glow micro-interaction.</div>
  </div>
</body>
</html>
