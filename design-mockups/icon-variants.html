<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Atleato — App Icon Variants</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800;900&family=Inter:wght@900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#050608;color:#f5f5f4;
    font-family:'Inter',sans-serif;
    padding:32px 16px;min-height:100vh;
  }
  h1{font-family:'Space Grotesk',sans-serif;font-size:28px;text-align:center;margin-bottom:8px}
  .sub{text-align:center;color:#888;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1.5px;margin-bottom:40px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:32px;max-width:920px;margin:0 auto}
  .card{background:#0f1013;border:1px solid #222;border-radius:18px;padding:20px;text-align:center}
  .label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.6px;color:#ff6b35;margin-bottom:14px;font-weight:700}
  .label small{display:block;color:#888;font-size:9px;letter-spacing:1px;font-weight:400;margin-top:4px}
  /* icon canvas */
  .icon{
    width:180px;height:180px;
    border-radius:42px; /* iOS-style continuous corner */
    margin:0 auto 10px;
    overflow:hidden;position:relative;
    box-shadow:0 12px 30px rgba(0,0,0,.6);
  }

  /* ── VARIANT A — Current (control) ─────────────────────────── */
  .a{background:#0d0d0d;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .a .l{font-family:'Inter',sans-serif;font-weight:900;font-size:130px;color:#ff6b35;line-height:1;letter-spacing:-6px}
  .a .b{width:74px;height:6px;background:#ff6b35;border-radius:3px;margin-top:-6px}

  /* ── VARIANT B — Bolder "A" + glow ─────────────────────────── */
  .b{background:#0a0b0d;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
  .b::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 50% 60%, rgba(255,107,53,.25), transparent 60%);
  }
  .b .l{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:160px;color:#ff6b35;line-height:1;letter-spacing:-8px;text-shadow:0 0 30px rgba(255,107,53,.45);z-index:2}
  .b .bar{width:96px;height:8px;background:#ff6b35;border-radius:4px;margin-top:-4px;z-index:2;box-shadow:0 0 14px rgba(255,107,53,.5)}

  /* ── VARIANT C — Gradient + dumbbell silhouette ────────────── */
  .c{background:linear-gradient(135deg,#ff6b35 0%,#e85020 100%);display:flex;align-items:center;justify-content:center;position:relative}
  .c::after{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.2), transparent 60%);
  }
  .c .l{font-family:'Inter',sans-serif;font-weight:900;font-size:150px;color:#1a1208;line-height:1;letter-spacing:-8px;z-index:2}

  /* ── VARIANT D — Monogram in circle ────────────────────────── */
  .d{background:#0a0b0d;display:flex;align-items:center;justify-content:center}
  .d .circle{
    width:130px;height:130px;border-radius:50%;
    background:#ff6b35;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 -8px 20px rgba(0,0,0,.25);
  }
  .d .l{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:90px;color:#1a1208;line-height:1;letter-spacing:-4px}

  .pick{margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:9px;color:#666;letter-spacing:1px}
</style>
</head>
<body>

<h1>Atleato — App Icon</h1>
<div class="sub">PICK A VARIANT BELOW</div>

<div class="grid">
  <div class="card">
    <div class="label">A — CURRENT<small>orange A + bar, neutral bg</small></div>
    <div class="icon a">
      <div class="l">A</div>
      <div class="b"></div>
    </div>
    <div class="pick">tell me "A"</div>
  </div>

  <div class="card">
    <div class="label">B — BOLDER + GLOW<small>same idea, bigger letter, soft glow</small></div>
    <div class="icon b">
      <div class="l">A</div>
      <div class="bar"></div>
    </div>
    <div class="pick">tell me "B"</div>
  </div>

  <div class="card">
    <div class="label">C — ORANGE FILL<small>full orange tile, dark A</small></div>
    <div class="icon c">
      <div class="l">A</div>
    </div>
    <div class="pick">tell me "C"</div>
  </div>

  <div class="card">
    <div class="label">D — MONOGRAM CIRCLE<small>orange disc with dark A inside</small></div>
    <div class="icon d">
      <div class="circle"><div class="l">A</div></div>
    </div>
    <div class="pick">tell me "D"</div>
  </div>
</div>

</body>
</html>
