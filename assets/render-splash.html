<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1284px;height:2778px;overflow:hidden;background:#0d0d0d;}
  .wrap{width:1284px;height:2778px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;}
  .wordmark{display:flex;align-items:baseline;gap:0;}
  .a{font-family:'Arial Black','Arial',sans-serif;font-weight:900;font-size:220px;color:#ff6b35;line-height:1;letter-spacing:-4px;}
  .rest{font-family:'Arial Black','Arial',sans-serif;font-weight:900;font-size:220px;color:#ffffff;line-height:1;letter-spacing:-4px;}
  .bar{width:860px;height:10px;background:#ff6b35;border-radius:5px;margin-top:16px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark">
    <span class="a">A</span><span class="rest">TLEATO</span>
  </div>
  <div class="bar"></div>
</div>
</body>
</html>
