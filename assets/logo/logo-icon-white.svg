<?xml version="1.0" encoding="UTF-8"?>
<!-- Evulto icon — WHITE polygon A with crossbar cutout. Transparent bg.
     For dark backgrounds where you want a monochrome white logo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <mask id="atleatoCrossbarMaskWhite">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="29" y="64" width="42" height="6" rx="3" fill="#000"/>
    </mask>
  </defs>
  <polygon points="50,8 14,92 30,92 50,42 70,92 86,92"
           fill="#ffffff"
           mask="url(#atleatoCrossbarMaskWhite)"/>
</svg>
