  <defs>
    <linearGradient id="atleatoGradBlk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8050"/>
      <stop offset="100%" stop-color="#e84d20"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="#0a0b0d"/>
  <polygon points="50,8 14,92 30,92 50,42 70,92 86,92" fill="url(#atleatoGradBlk)"/>
  <rect x="29" y="64" width="42" height="6" rx="3" fill="#0a0b0d"/>
