<?xml version="1.0" encoding="UTF-8"?>
<!-- Evulto full lockup — polygon A (with crossbar cutout) + black wordmark.
     Transparent bg. For light backgrounds. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="atleatoGradFull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8050"/>
      <stop offset="100%" stop-color="#e84d20"/>
    </linearGradient>
    <mask id="atleatoCrossbarMaskFull">
      <rect width="400" height="100" fill="#fff"/>
      <rect x="29" y="64" width="42" height="6" rx="3" fill="#000"/>
    </mask>
  </defs>
  <polygon points="50,8 14,92 30,92 50,42 70,92 86,92"
           fill="url(#atleatoGradFull)"
           mask="url(#atleatoCrossbarMaskFull)"/>
  <text x="108" y="76" font-family="Arial Black, Helvetica, sans-serif" font-size="62" font-weight="900" fill="#0a0b0d" letter-spacing="-2">Evulto</text>
  <text x="345" y="34" font-family="monospace" font-size="13" fill="#888">™</text>
</svg>
