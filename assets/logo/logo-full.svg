<?xml version="1.0" encoding="UTF-8"?>
<!-- Atleato full lockup — polygon A + "Atleato" wordmark, BLACK text.
     For light backgrounds. Transparent bg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="atleatoGradFull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8050"/>
      <stop offset="100%" stop-color="#e84d20"/>
    </linearGradient>
  </defs>
  <polygon points="50,8 14,92 30,92 50,42 70,92 86,92" fill="url(#atleatoGradFull)"/>
  <text x="108" y="76" font-family="Arial Black, Helvetica, sans-serif" font-size="62" font-weight="900" fill="#0a0b0d" letter-spacing="-2">Atleato</text>
  <text x="345" y="34" font-family="monospace" font-size="13" fill="#888">™</text>
</svg>
