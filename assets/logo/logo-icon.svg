<?xml version="1.0" encoding="UTF-8"?>
<!-- Atleato icon — official polygon-A with crossbar cutout.
     Matches atleato.com header EXACTLY (orange A + horizontal bar cutout).
     Transparent background. Uses mask to cut a real hole through the A. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="atleatoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8050"/>
      <stop offset="100%" stop-color="#e84d20"/>
    </linearGradient>
    <mask id="atleatoCrossbarMask">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="29" y="64" width="42" height="6" rx="3" fill="#000"/>
    </mask>
  </defs>
  <polygon points="50,8 14,92 30,92 50,42 70,92 86,92"
           fill="url(#atleatoGrad)"
           mask="url(#atleatoCrossbarMask)"/>
</svg>
