<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1024px;height:1024px;overflow:hidden;background:#0d0d0d;}
  .wrap{width:1024px;height:1024px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;}
  .letter{font-family:'Arial Black','Arial',sans-serif;font-weight:900;font-size:720px;color:#ff6b35;line-height:1;letter-spacing:-20px;}
  .bar{width:420px;height:24px;background:#ff6b35;border-radius:12px;margin-top:-40px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="letter">A</div>
  <div class="bar"></div>
</div>
</body>
</html>
